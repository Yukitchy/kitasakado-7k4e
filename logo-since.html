<h1>坂戸のサイズ 5パターン</h1>
<p class="sub">ベースとSINCEは同じ横幅で固定。坂戸だけ段階的に拡大（パターン1＝3行同幅 → パターン5＝ベースの1.4倍）。番号で指定してください。</p>
